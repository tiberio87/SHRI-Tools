name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build portable EXE
        run: npm run dist

      - name: Upload EXE to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-linux:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'

        - name: Install build dependencies
          run: sudo apt-get update && sudo apt-get install -y libfuse2 qemu-user-static wine

        - name: Install dependencies
          run: npm ci

        - name: Build AppImage
          run: npm run dist:linux

        - name: Make AppImage executable
          run: chmod +x dist/*.AppImage || true

        - name: Upload Linux artifacts
          uses: actions/upload-artifact@v4
          with:
            name: linux-artifacts
            path: dist/*.AppImage        
          
  create-release:
  needs: [build-windows, build-linux]
  runs-on: ubuntu-latest
  steps:
    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-artifacts
        path: artifacts/windows

    - name: Download Linux artifacts
      uses: actions/download-artifact@v4
      with:
        name: linux-artifacts
        path: artifacts/linux

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload all artifacts to release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/windows/*.exe
          artifacts/linux/*.AppImage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}